 <v:textbox>
  <![if !mso]>
  <table cellpadding=0 cellspacing=0 width="100%">
   <tr>
    <td><![endif]>
    <div>
    <p class=MsoNormal style='text-align:justify;line-height:normal'><b
    style='mso-bidi-font-weight:normal'><span style='font-size:14.0pt;
    font-family:"Verdana",sans-serif;mso-bidi-font-family:Arial;color:#0070C0'>Federico
    <span class=SpellE>Miyara</span><o:p></o:p></span></b></p>
    <p class=MsoNormal style='text-align:justify;line-height:normal'><span
    style='font-size:14.0pt;font-family:"Verdana",sans-serif;mso-bidi-font-family:
    Arial;color:black;mso-themecolor:text1'>El sonido es una vibración del aire
    que se propaga en forma de odas a través del espacio. Esta caracterizado primariamente
    por una frecuencia y por una intensidad. La frecuencia es la cantidad de
    vibraciones en cada segundo, expresada en Hertz [Hz] Y se relaciona con la
    altura, es decir la sensación de grave (baja frecuencia) o agudo (alta
    frecuencia). La cantidad se relaciona con la sensación de menor o mayor
    sonoridad o volumen. Los sonidos simples o tonos puros contienen una sola
    frecuencia. Es el caso del diapasón de horquillas, utilizando para afinar
    instrumentos, o del silbido. Normalmente los sonidos que escuchamos, como
    las notas musicales o la voz humana, están compuestos por varios tonos
    puros. Cuando un sonido contiene una cantidad muy grande de tonos puros
    simultáneos se convierte en un ruido. Otra acepción de la palabra ruido es
    la de un sonido no deseado. Es ésta la acepción a la cual nos referimos en
    lo sucesivo.<o:p></o:p></span></p>
    <p class=MsoNormal><o:p>&nbsp;</o:p></p>
